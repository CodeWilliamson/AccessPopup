<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HammerTime Wi-Fi Setup</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <header>
      <img src="{{ url_for('static', filename='pi-logo.svg') }}" alt="Raspberry Pi Logo" width="64" height="64">
      <div>
        <h1>Wi-Fi Setup</h1>
        <p>Connect Raspberry Pi to Wi-Fi</p>
      </div>
    </header>

    <section id="message" class="message hidden"></section>

    <label for="network">Wi-Fi network</label>
    <select id="network">
      <option value="">Scanning...</option>
    </select>

    <div id="security-row">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Enter Wi-Fi password" required>
    </div>

    <button id="connect" class="primary">Connect</button>
    <button id="rescan" class="secondary">Rescan networks</button>

    <div id="spinner" class="spinner hidden" aria-live="polite">
      <span></span> Connecting…
    </div>

    <h2 class="section-title">Saved networks</h2>
    <ul id="profiles" class="profiles">
      <li class="profile-empty">Loading…</li>
    </ul>

    <p class="footnote">The Wi-Fi profile is only kept if the connection succeeds.</p>
  </main>

<script>
const network = document.getElementById('network');
const password = document.getElementById('password');
const connectButton = document.getElementById('connect');
const rescanButton = document.getElementById('rescan');
const message = document.getElementById('message');
const spinner = document.getElementById('spinner');
const profilesList = document.getElementById('profiles');

function showMessage(text, kind='error') {
  message.textContent = text;
  message.className = `message ${kind}`;
  message.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
function clearMessage() {
  message.textContent = '';
  message.className = 'message hidden';
}
function setBusy(busy) {
  connectButton.disabled = busy;
  rescanButton.disabled = busy;
  network.disabled = busy;
  password.disabled = busy;
  profilesList.querySelectorAll('button, input').forEach(el => { el.disabled = busy || el.classList.contains('connected'); });
  spinner.classList.toggle('hidden', !busy);
}
function updatePasswordVisibility() {
  const selected = network.options[network.selectedIndex];
  document.getElementById('security-row').style.display = selected && selected.value ? 'block' : 'none';
  password.placeholder = 'Enter Wi-Fi password';
}

async function loadNetworks(force=false) {
  network.innerHTML = '<option value="">Scanning...</option>';
  try {
    const response = await fetch(force ? '/api/rescan' : '/api/networks', {method: force ? 'POST' : 'GET'});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Unable to scan for networks.');

    network.innerHTML = '';
    if (!data.networks.length) {
      network.innerHTML = '<option value="">No networks found</option>';
      updatePasswordVisibility();
      return;
    }

    for (const item of data.networks) {
      const option = document.createElement('option');
      option.value = item.ssid;
      option.dataset.security = item.security;
      const lock = item.security && item.security !== 'Open' ? ' 🔒' : '';
      option.textContent = `${item.ssid}  (${item.signal}%)${lock}`;
      network.appendChild(option);
    }
    updatePasswordVisibility();
  } catch (error) {
    network.innerHTML = '<option value="">Unable to scan</option>';
    showMessage(error.message);
  }
}

network.addEventListener('change', updatePasswordVisibility);
rescanButton.addEventListener('click', () => { clearMessage(); loadNetworks(true); });

function makeButton(text, className, onClick) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = className;
  button.textContent = text;
  button.addEventListener('click', onClick);
  return button;
}

async function loadProfiles() {
  try {
    const response = await fetch('/api/profiles');
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Unable to load saved networks.');
    renderProfiles(data.profiles);
  } catch (error) {
    profilesList.innerHTML = '<li class="profile-empty">Unable to load saved networks</li>';
  }
}

function renderProfiles(profiles) {
  profilesList.innerHTML = '';
  if (!profiles.length) {
    profilesList.innerHTML = '<li class="profile-empty">No saved networks</li>';
    return;
  }

  for (const profile of profiles) {
    const item = document.createElement('li');
    item.className = 'profile';

    const head = document.createElement('div');
    head.className = 'profile-head';
    const name = document.createElement('span');
    name.className = 'profile-name';
    name.textContent = profile.name;
    const meta = document.createElement('span');
    meta.className = 'profile-meta';
    meta.textContent = `Priority ${profile.priority}`;
    head.append(name, meta);

    const form = document.createElement('form');
    form.className = 'profile-edit hidden';
    const pwInput = document.createElement('input');
    pwInput.type = 'password';
    pwInput.autocomplete = 'new-password';
    pwInput.placeholder = 'New password (leave blank to keep)';
    const prInput = document.createElement('input');
    prInput.type = 'number';
    prInput.min = '-999';
    prInput.max = '999';
    prInput.step = '1';
    prInput.value = profile.priority;
    prInput.setAttribute('aria-label', 'Priority');
    const formActions = document.createElement('div');
    formActions.className = 'profile-actions';
    const saveButton = makeButton('Save', 'primary', () => {});
    saveButton.type = 'submit';
    formActions.append(saveButton, makeButton('Cancel', 'secondary', () => form.classList.add('hidden')));
    const pwLabel = document.createElement('label');
    pwLabel.textContent = 'Password';
    const prLabel = document.createElement('label');
    prLabel.textContent = 'Priority (higher connects first)';
    form.append(pwLabel, pwInput, prLabel, prInput, formActions);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      saveProfile(profile, pwInput.value, prInput.value);
    });

    const actions = document.createElement('div');
    actions.className = 'profile-actions';
    actions.append(
      profile.active
        ? Object.assign(makeButton('Connected', 'connected', () => {}), {disabled: true})
        : makeButton('Connect', 'primary', () => connectProfile(profile)),
      makeButton('Edit', 'secondary', () => form.classList.toggle('hidden')),
      makeButton('Delete', 'danger', () => deleteProfile(profile)),
    );

    item.append(head, actions, form);
    profilesList.appendChild(item);
  }
}

async function saveProfile(profile, newPassword, priority) {
  clearMessage();
  try {
    const response = await fetch(`/api/profiles/${encodeURIComponent(profile.uuid)}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: newPassword, priority: Number(priority)})
    });
    const data = await response.json();
    if (!data.success) throw new Error(data.error || 'Unable to save changes.');
    showMessage(`Saved ${profile.name}`, 'success');
    await loadProfiles();
  } catch (error) {
    showMessage(error.message);
  }
}

async function deleteProfile(profile) {
  if (!confirm(`Delete saved network "${profile.name}"?`)) return;
  clearMessage();
  try {
    const response = await fetch(`/api/profiles/${encodeURIComponent(profile.uuid)}`, {method: 'DELETE'});
    const data = await response.json();
    if (!data.success) throw new Error(data.error || 'Unable to delete network.');
    showMessage(`Deleted ${profile.name}`, 'success');
    await loadProfiles();
  } catch (error) {
    showMessage(error.message);
  }
}

async function connectProfile(profile) {
  clearMessage();
  setBusy(true);
  try {
    const response = await fetch(`/api/profiles/${encodeURIComponent(profile.uuid)}/connect`, {method: 'POST'});
    await handleConnectResponse(response);
  } catch (error) {
    showMessage('The connection attempt could not be completed. The access point should still be available.');
    setBusy(false);
  }
}

async function handleConnectResponse(response) {
  const data = await response.json();
  if (data.success) {
    showMessage(`Connected to ${data.ssid}`, 'success');
    setTimeout(() => { window.location.href = 'http://' + data.ip + '/'; }, 5000);
  } else {
    showMessage(data.error || 'Connection failed. Please check the password and try again.');
    setBusy(false);
    await Promise.all([loadNetworks(false), loadProfiles()]);
  }
}

connectButton.addEventListener('click', async () => {
  const ssid = network.value;
  if (!ssid) {
    showMessage('Please select a Wi-Fi network.');
    return;
  }
  if (!password.value.trim()) {
    showMessage('Please enter a Wi-Fi password.');
    password.focus();
    return;
  }

  clearMessage();
  setBusy(true);
  try {
    const response = await fetch('/api/connect', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ssid, password: password.value})
    });
    await handleConnectResponse(response);
  } catch (error) {
    showMessage('The connection attempt could not be completed. The access point should still be available.');
    setBusy(false);
  }
});

loadNetworks();
loadProfiles();
</script>
</body>
</html>
